name: Library checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:library
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:library
      - run: npm test
      - run: npm run test:package
      - run: npm run build
      - run: npm run test:bundle
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:library:cross-browser
      - run: LIBRARY_PRODUCTION=1 LIBRARY_CROSS_BROWSER=1 npm run test:site:browser
      - run: npm ci --prefix examples/vite
      - run: npm --prefix examples/vite run typecheck
      - run: npm --prefix examples/vite run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-quality-evidence
          path: |
            test-results/
            quality-results/
          if-no-files-found: ignore
